name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify tag matches manifest version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag ($TAG) does not match manifest.json version ($VERSION)"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail
          test -f main.js
          test -f manifest.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json

      - name: Upload styles.css
        if: ${{ hashFiles('styles.css') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" styles.css --clobber
